<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organs player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain;
          background: #000; opacity: 0; transition: opacity 1.5s ease; }
  video.on { opacity: 1; }
  #debug { position: fixed; left: 12px; bottom: 12px; z-index: 10; font: 13px/1.5 monospace;
           color: #9f9; background: rgba(0,0,0,.6); padding: 6px 10px; white-space: pre; display: none; }
</style>
</head>
<body>
<video id="fallback" muted loop playsinline preload="auto"></video>
<video id="live" muted playsinline autoplay></video>
<div id="debug"></div>
<script src="config.js"></script>
<script src="hls.min.js"></script>
<script src="player.js"></script>
</body>
</html>
